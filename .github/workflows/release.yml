name: Release
on:
  push:
    tags: ['v*']

# There is no binary to attach: without a paid developer account a download
# would only be a file macOS warns about. The release marks a tested commit,
# and people build it themselves — which is the install path anyway.
jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Check it builds and bundles
        run: ./scripts/bundle.sh release

      - name: Take the notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything under this version's heading, up to the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          cat >> notes.md <<'EOF'

          ---

          Install or update:

          ```bash
          git clone https://github.com/selinihtyr/still-running
          cd still-running && ./scripts/install.sh
          ```

          Requires macOS 26 and Xcode 26. There is no download to notarise, so
          you build it yourself and Gatekeeper stays out of it.
          EOF

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
